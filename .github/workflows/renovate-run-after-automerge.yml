name: Renovate — run after automerge

# A PR that Renovate automerges produces no Renovate job, so nothing tells it that `main` moved:
# every other open Renovate PR then sits BEHIND the new base — unmergeable under this repo's
# ruleset, which requires up-to-date branches — until the next scheduled run. This workflow
# requests a run instead, by ticking the Mend-only "manual job" checkbox on the Dependency
# Dashboard, an edit whose webhook Mend does act on.
#
# `workflow_dispatch` is deliberate rather than a convenience: it makes the mechanism testable on
# demand, without waiting for an automerge. The monthly `schedule` exists because nothing else
# exercises this while automerge is off — see "Proving a dormant control still works" in
# .claude/CLAUDE.md for why the probe ticks the box for real and waits to be answered.
#
# See .claude/CLAUDE.md "Renovate run after automerge" for the evidence, the measured cost, and the
# alternative considered (`platformAutomerge: false`).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly rot probe, 04:00 UTC on the 1st. Monthly rather than weekly because what it guards
    # is dormant: a month's detection latency is nothing against a re-enable date measured in
    # months, and each run costs a real (harmless) Renovate run.
    - cron: "0 4 1 * *"

# Carried for consistency with every other workflow here (see .claude/CLAUDE.md "Superseding CI
# runs"), though it can't actually supersede anything: `closed` fires once per PR, and a dispatch
# or scheduled run keys on the unique `run_id`. Keeping the shape uniform beats an exception to
# explain.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  request-run:
    name: Request a Renovate run
    # `merged` excludes a PR closed without merging. `merged_by.login` is the REST/webhook
    # spelling of the actor GraphQL reports as `app/renovate` — matching the GraphQL spelling
    # here would silently never fire.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
      github.event.pull_request.merged_by.login == 'renovate[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point: editing the dashboard issue body is what emits the webhook.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned to main rather than the default: on a `pull_request` event `github.ref` is
          # `refs/pull/<n>/merge`, so the two triggers would otherwise run different trees, and
          # that ref stops being maintained once the PR closes. This job wants only the script.
          ref: main
          # The gh calls below authenticate via GH_TOKEN explicitly; nothing here pushes.
          persist-credentials: false

      # Same reasoning as renovate-derived-files.yml: the runner's stock python3 lags the level in
      # //:.python-version, and ruff (via `requires-python`) is free to emit syntax that new.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # Discovered rather than hardcoded to #1: Renovate opens a fresh dashboard (with a new
      # number) if the existing one is ever closed. Listing rather than `--search` deliberately —
      # the search index is eventually consistent, and this has to be right immediately.
      - name: Locate and fetch the Dependency Dashboard
        id: dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --repo "${REPO}" --state open --limit 100 \
            --json number,title,author \
            --jq '[.[] | select(.title == "Dependency Dashboard" and .author.login == "app/renovate")]
                  | .[0].number // empty')
          if [ -z "${issue}" ]; then
            echo "::error::No open Dependency Dashboard issue found; cannot request a Renovate run."
            exit 1
          fi
          echo "Dependency Dashboard is issue #${issue}."
          echo "issue=${issue}" >> "${GITHUB_OUTPUT}"
          # `jq -j`, not `gh --jq`: the latter appends a trailing newline, which would be PATCHed
          # back into the body and accumulate one byte per run.
          gh api "repos/${REPO}/issues/${issue}" | jq -j .body > body.md

      - name: Tick the manual-job checkbox
        id: tick
        run: python3 meta/scripts/renovate_manual_job.py < body.md > body.new.md

      # Mend owns this checkbox and has removed it before (renovatebot/renovate#20386). Failing
      # loudly beats a green run that silently stopped requesting anything.
      - name: Fail if the manual-job checkbox is missing
        if: steps.tick.outputs.status == 'absent'
        run: |
          echo "::error::Dashboard has no '<!-- manual job -->' checkbox — Mend may have changed it."
          exit 1

      # After a real automerge a pending request already achieves the goal, so note it and move on.
      - name: Note an already-pending request
        if: steps.tick.outputs.status == 'already-ticked' && github.event_name == 'pull_request'
        run: |
          echo "::notice::Checkbox already ticked; a Renovate run is pending, which is what this workflow wanted."

      # On the probe's own triggers the same result is a dead end rather than a shortcut: we sent
      # nothing, so whoever clears the box next tells us nothing about Mend still acting on
      # `github-actions[bot]`. Watching someone else's request get consumed and calling that a pass
      # is precisely the fail-open shape this probe exists to remove, so refuse to guess.
      - name: Fail if the probe could not send its own request
        if: steps.tick.outputs.status == 'already-ticked' && github.event_name != 'pull_request'
        run: |
          echo "The checkbox was already ticked, so this run made no edit and nothing to verify."
          echo "Someone ticked it by hand, or an earlier request was never consumed. Re-run once"
          echo "the box is clear; if it never clears, that is the rot this probe looks for."
          echo "::error::Probe could not send its own request — checkbox was already ticked."
          exit 1

      # jq -Rs builds the JSON string, so a body containing quotes or backslashes survives intact.
      - name: Request a Renovate run
        if: steps.tick.outputs.status == 'ticked'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.dashboard.outputs.issue }}
        run: |
          set -euo pipefail
          jq -Rs '{body: .}' < body.new.md \
            | gh api -X PATCH "repos/${REPO}/issues/${ISSUE}" --input -
          echo "Requested a Renovate run via the Dependency Dashboard checkbox."

      # Ticking the box only proves we can edit an issue. The half that can rot silently is Mend
      # still *acting* on an edit from `github-actions[bot]` — the assumption the whole design
      # rests on — and the only observable for that is Renovate clearing the box on the run it
      # starts. Measured at ~37s twice: 2026-08-01, and 2026-08-28 with no open Renovate PRs at
      # all, so ten minutes is a wide margin rather than a guess.
      #
      # Gated on `ticked` so this only ever judges a transition *we* caused; `already-ticked` fails
      # in the step above rather than borrowing someone else's request as evidence. A Renovate run
      # we did not trigger can still clear our box inside the window (~2.5% of probes at the
      # measured 6.7 h schedule median), which reads as a pass — accepted, because the alternative
      # is asking Mend which webhook started a run, and it does not say.
      #
      # Skipped on `pull_request`: after a real automerge the request either works or the stale PRs
      # make it obvious, and holding a runner for ten minutes to re-learn that buys nothing.
      - name: Verify Renovate acted on the request
        if: github.event_name != 'pull_request' && steps.tick.outputs.status == 'ticked'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.dashboard.outputs.issue }}
        run: |
          set -euo pipefail
          # Counted so the timeout below can tell "Mend never answered" from "we never asked".
          reads=0
          for _ in $(seq 1 30); do
            sleep 20
            # `|| continue` because one 502 out of thirty calls should not end the poll: under
            # `set -e` a failed substitution exits the step immediately, skipping every diagnostic
            # below it. Still fail-closed — a persistent failure just runs out the clock.
            state=$(gh api "repos/${REPO}/issues/${ISSUE}" | jq -j .body \
              | python3 meta/scripts/renovate_manual_job.py --check) || {
              echo "Poll attempt failed (transient?); retrying."
              continue
            }
            reads=$((reads + 1))
            case "${state}" in
              clear)
                echo "Renovate cleared the checkbox; the request was received and acted on."
                exit 0
                ;;
              ticked)
                # Not yet consumed. The expected state for the first poll or two.
                ;;
              absent)
                echo "The checkbox disappeared while polling, so Mend has changed the dashboard."
                echo "::error::The '<!-- manual job -->' checkbox vanished mid-poll."
                exit 1
                ;;
              *)
                # A state this loop does not know. Blaming Mend for it would send the reader to
                # developer.mend.io for a defect that is ours, so say whose it is.
                echo "renovate_manual_job.py --check printed an unrecognised state: '${state}'."
                echo "::error::Unrecognised --check state '${state}' — this repo's script, not Mend."
                exit 1
                ;;
            esac
          done
          if [ "${reads}" -eq 0 ]; then
            echo "Every poll failed, so the checkbox was never read even once. That points at this"
            echo "job's access — a revoked token, a permissions change, a network partition —"
            echo "rather than at Mend, which we never got far enough to ask."
            echo "::error::Could not read the dashboard on any poll; suspect API access, not Mend."
            exit 1
          fi
          echo "The edit landed but the checkbox never cleared. Either Mend stopped enqueueing"
          echo "jobs for this sender, or its queue is badly backed up. Read the job log at"
          echo "developer.mend.io before assuming this workflow is at fault."
          echo "::error::Renovate did not clear the manual-job checkbox within 10 minutes."
          exit 1
