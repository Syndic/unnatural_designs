name: Devcontainer

# Build the devcontainer and smoke-test the toolchain it ships. Catches breakage from
# Renovate-driven bumps to the Debian base, the `features` block (go, etc.), the Dockerfile's
# PYTHON_VERSION, or BAZELISK_VERSION before someone hits it locally.
# The workflow always runs so the status check always reports; path filtering happens in the
# `changes` job. See .claude/CLAUDE.md "A required check cannot be filtered at the trigger".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Republish: run on main to build, test and publish the base image the tree pins, e.g. after a
  # publish failed and the `Base image pin published` check went red.
  workflow_dispatch:

# Supersede in-flight runs for the same PR; see .claude/CLAUDE.md "Superseding CI runs".
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push/pull the devcontainer build-cache image on GHCR

jobs:
  # Split out so the base-image matrix and the publish job can gate on the same classification
  # without each re-running the diff. `build-and-smoke-test` keeps its name and reports on every
  # PR because it is the required status check; `base-image` below can skip outright, since the
  # fan-in over it is what reports in its place.
  changes:
    name: Detect devcontainer changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.classify.outputs.changed }}
      base: ${{ steps.classify.outputs.base }}
      pin: ${{ steps.pin.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history back to the PR base / previous push so we can diff for changed paths.
          fetch-depth: 0

      # Pick the base to diff against (the classifier handles the diff, the zero-SHA
      # branch-creation case, and emitting `changed`). PRs diff the base branch tip;
      # pushes diff the previous tip. A manual run is a republish, so it takes the base path.
      - id: classify
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Which paths feed which set — and why MODULE.bazel and .bazelversion are in the
          # base-image set, and what including them costs — is defined once in
          # meta/scripts/path_classification_pattern_sets.py. `base` is a subset of `changed` by
          # construction there, which is what the BASE_IMAGE override below depends on.
          python3 meta/scripts/classify_changed_paths.py \
            --base "$base" \
            --emit changed \
            --emit base

      # `published`, `unpublished`, or `edited` when this change moves the pin, whose image
      # `publish` pushes on merge. Anything short of GHCR resolving the exact digest is
      # `unpublished`, which the jobs below answer with a base build rather than a pass; see
      # README.md "What makes a check binding". Reads the pin through sync_base_image_pin.py for
      # the reason `publish`'s verify step gives.
      - id: pin
        env:
          BASE_EDITED: ${{ steps.classify.outputs.base }}
        run: |
          set -euo pipefail
          case "$BASE_EDITED" in
            true) echo "pin=edited" >> "$GITHUB_OUTPUT"; exit 0 ;;
            false) ;;
            *) echo "::error::unexpected base classification '${BASE_EDITED}'"; exit 1 ;;
          esac
          repo=ghcr.io/syndic/unnatural_designs-devcontainer-base
          pinned="$(python3 meta/scripts/sync_base_image_pin.py --print-pinned)"
          err="${RUNNER_TEMP}/imagetools-inspect.err"
          rc=0
          resolved="$(timeout 60 docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' "${repo}@${pinned}" 2>"$err")" || rc=$?
          if [ "$resolved" = "$pinned" ]; then
            echo "${repo}@${pinned} is published."
            echo "pin=published" >> "$GITHUB_OUTPUT"
          else
            hint=""
            [ "$rc" -ne 124 ] || hint=" (timed out)"
            echo "${repo}@${pinned} did not resolve: inspect exited ${rc}${hint} and" \
                 "returned '${resolved:-nothing}'. Its stderr follows:"
            cat "$err"
            echo "pin=unpublished" >> "$GITHUB_OUTPUT"
          fi

  # ── Shared base image ───────────────────────────────────────────────────────────────
  # meta/devcontainer-base/ is published for other Syndic repos to FROM. Bazel assembles it and
  # unit-tests its layer layout without a daemon (//meta/devcontainer-base:test_image_layers,
  # in the Build and test job), so what is left here is the part Bazel deliberately does not
  # do: put the image in a daemon and run it.
  #
  # Matrixed over both architectures because `oci_load` can only materialise one — a Docker tag
  # holds a single image. On amd64 alone the arm64 manifest would ship having only ever been
  # assembled, and arm64 is the architecture developer hosts actually run. The runners are
  # native (`ubuntu-24.04-arm`, as ci.yml already uses), so this costs no QEMU — which is the
  # constraint the image is shaped around.
  #
  # Runs whenever the base the consumer builds on is the tree's own rather than the published pin.
  base-image:
    name: Base image (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.pin != 'published'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel-remote
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # `:push` is otherwise only ever executed after merge. Building it stages both arches'
      # blobs as runfiles — the part `:load` (one architecture) does not cover — and needs no
      # registry credentials, so the PR path can carry it.
      - name: Stage the push runfiles
        run: bazel build --config=ci --config=${{ matrix.platform }} //meta/devcontainer-base:push

      # `--config=<platform>` rather than letting the `select()` fall out of host detection:
      # it makes the resolved architecture explicit and mirrors ci.yml's matrix pairing.
      - name: Load the shared base image into Docker
        run: bazel run --config=ci --config=${{ matrix.platform }} //meta/devcontainer-base:load

      - name: Smoke test the base image
        run: |
          set -euo pipefail
          docker run --rm devcontainer-base:ci bash -c '
            set -euo pipefail
            command -v devcontainer-plumbing >/dev/null
            test -x "$(command -v devcontainer-plumbing)"
            # The dispatcher is installed on PATH but its library is not beside it, so this
            # also proves the absolute fallback path resolves in the image layout.
            test -r /usr/local/share/devcontainer-plumbing/lib.sh

            # A bad verb must be a usage error, not a silent no-op or a partial apply.
            rc=0
            out="$(devcontainer-plumbing bogus-verb 2>&1)" || rc=$?
            test "$rc" -eq 2
            case "$out" in usage:*) ;; *) echo "unexpected: $out" >&2; exit 1 ;; esac

            # Same for no verb at all.
            rc=0
            devcontainer-plumbing >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 2
            echo "base image smoke test OK"
          '

  # Fan-in so branch protection has one stable name to require instead of one per matrix row —
  # same pattern as ci.yml's `build-and-test-all`. Adding an architecture then needs no branch
  # protection edit, and a failure on any row blocks the merge.
  #
  # Unlike ci.yml's equivalent, `skipped` has to pass: that matrix runs only when the pin is not
  # the published image, so most PRs legitimately skip it. Only failure and cancellation are real.
  #
  # That is why `changes` is a separate question rather than one more result to accept: a gate
  # that *failed to evaluate* skips the matrix byte-identically to a gate that ran and said no.
  # //meta/scripts:test_ci_enforcement_manifest keeps both questions asked, and
  # //meta/scripts:test_devcontainer_required_checks keeps `changes` in `needs:` to be asked about.
  base-image-all:
    name: Base image (all platforms)
    needs:
      - changes
      - base-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every base-image row passed
        run: |
          set -euo pipefail
          classification="${{ needs.changes.result }}"
          result="${{ needs.base-image.result }}"
          echo "changes result: $classification"
          echo "base-image result: $result"
          # No `case`: the gate is only ever allowed to have succeeded.
          [ "$classification" = success ] || exit 1
          case "$result" in
            success | skipped) ;;
            *) exit 1 ;;
          esac

  # `!cancelled()` rather than the bare default: a failed `changes` would otherwise skip this job
  # outright, and branch protection counts a skipped required check as passed. Why this and not
  # `always()`, which would do that too: .claude/CLAUDE.md "Superseding CI runs".
  build-and-smoke-test:
    name: Build devcontainer and smoke test
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # First, because every `needs.changes.outputs.*` gate below reads empty when the
      # classification failed — which is indistinguishable from it having matched nothing, and
      # would leave this job echoing "no devcontainer changes" and reporting green.
      - name: Verify the classification ran
        run: |
          set -euo pipefail
          result="${{ needs.changes.result }}"
          echo "changes result: $result"
          [ "$result" = success ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Feature lock freshness ────────────────────────────────────────────────────
      # devcontainer-lock.json is derived from the feature references in devcontainer.json and
      # regenerated by renovate-derived-files.yml. This is the guard that the committed copy
      # actually matches — the counterpart to the `bazel-mod-tidy` and `uv-lock-fresh` pre-commit
      # hooks the other derived files get. It lives in CI rather than pre-commit because the
      # devcontainer CLI is a host/runner tool: it is deliberately absent from the image, so a
      # `language: unsupported` hook running inside the container could not invoke it.
      #
      # `upgrade --dry-run` prints the lockfile it *would* write to stdout instead of writing it,
      # byte-for-byte including the trailing newline, so a plain diff is the whole check. Runs
      # unconditionally (it is seconds, and a hand-edited lock is worth catching on any PR) and
      # before the build, so a drifted lock fails fast rather than after a five-minute build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24.21.0"

      - name: Check the feature lock is in sync
        env:
          # renovate: datasource=npm depName=@devcontainers/cli
          DEVCONTAINER_CLI_VERSION: "0.89.0"
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"
          devcontainer upgrade --workspace-folder . --dry-run > /tmp/expected-lock.json
          if ! diff -u .devcontainer/devcontainer-lock.json /tmp/expected-lock.json; then
            MSG="Feature lock is out of sync with the references in devcontainer.json."
            MSG="${MSG} Run 'devcontainer upgrade --workspace-folder .' and commit the result."
            echo "::error file=.devcontainer/devcontainer-lock.json::${MSG}"
            exit 1
          fi
          echo "Feature lock matches the references in devcontainer.json."

      # Cache the built image in GHCR so the expensive feature layers (Go tools ~90s, etc.)
      # are reused across runs instead of rebuilt cold every time. The ref must be lowercase
      # (GHCR rejects uppercase), and ${{ github.repository }} carries the org's casing.
      # Only the consumer build needs a ref computed here; the base image's own repository is
      # declared on the `oci_push` target in meta/devcontainer-base/BUILD.bazel.
      - id: img
        if: needs.changes.outputs.changed == 'true' || needs.changes.outputs.pin == 'unpublished'
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-devcontainer" >> "$GITHUB_OUTPUT"

      # Auth for the GHCR cache. Skipped on fork PRs — their read-only token can't reach the
      # package, so they fall back to a cold build. Needs the packages: write permission above.
      # The base image's own push authenticates separately, in the publish job.
      - if: >-
          (needs.changes.outputs.changed == 'true' || needs.changes.outputs.pin == 'unpublished')
          && github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The consumer builds on the tree's own base, tagged `devcontainer-base:ci` by `:load`,
      # whenever the pin is not the published image: so a base change is smoke-tested before it
      # can publish, and an unpublished pin still gets a blocking build of what it names.
      - if: needs.changes.outputs.pin != 'published'
        uses: ./.github/actions/setup-bazel-remote
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # `--config=linux_x86_64` rather than letting `oci_load`'s select() fall out of host
      # detection, for the same reason the base-image matrix passes it: the architecture the
      # consumer is built on stays explicit. This runner is amd64.
      #
      # The `.bazelrc.user` removal is not tidiness: setup-bazel-remote writes the BuildBuddy
      # key into it, in the workspace devcontainers/ci bind-mounts into the container a few
      # steps below. Nothing here reads it again.
      - if: needs.changes.outputs.pin != 'published'
        name: Load the shared base image into Docker
        run: |
          bazel run --config=ci --config=linux_x86_64 //meta/devcontainer-base:load
          rm -f .bazelrc.user

      # devcontainers/ci builds with the full feature set (so feature bumps are exercised,
      # not just the Dockerfile) and runs the smoke command inside the resulting container.
      # cacheFrom reuses the previously-built layers; push: filter seeds the cache on pushes
      # to main only (PRs build against the cache but don't publish). A main push built against
      # `devcontainer-base:ci` seeds a cache the next pinned builds miss; see "Consuming the
      # image" in meta/devcontainer-base/README.md.
      - if: needs.changes.outputs.changed == 'true' || needs.changes.outputs.pin == 'unpublished'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # The action has no build-arg input, so the override travels through
          # devcontainer.json's `build.args` as ${localEnv:DEVCONTAINER_BASE_IMAGE}.
          # `pinned-base` is the Dockerfile's stage alias for the pinned digest, not a registry
          # reference.
          DEVCONTAINER_BASE_IMAGE: ${{ needs.changes.outputs.pin == 'published' && 'pinned-base' || 'devcontainer-base:ci' }}
        with:
          imageName: ${{ steps.img.outputs.ref }}
          cacheFrom: ${{ steps.img.outputs.ref }}
          push: filter
          # `bazel --version` exercises the full Bazelisk chain: download from the URL
          # baked into BAZELISK_VERSION, then bootstrap Bazel per .bazelversion.
          # `go version` confirms the `go` feature landed the toolchain on PATH;
          # `python3 --version` confirms the Dockerfile's uv-installed interpreter did.
          # The agent-tool block is annotated inline; everything after it pins the
          # host-plumbing mechanism — see meta/devcontainer-base/README.md.
          runCmd: |
            set -euo pipefail
            bazel --version
            go version
            python3 --version

            # Agent tools no gate runs. A failed install already fails the build; these catch
            # one that installs but won't run for remoteUser (wrong-arch asset, unreachable
            # interpreter) or isn't on PATH. jq has no pin of ours: common-utils provides it.
            actionlint --version
            yq --version
            cosmic-ray --version
            check-jsonschema --version
            gremlins --version
            jq --version

            # The plumbing arrived via the base image, at the paths the hooks call it by.
            # Nothing in this repo installs either file, so these fail if the FROM regressed
            # to a plain Debian base.
            test -x /usr/local/bin/devcontainer-plumbing
            test -r /usr/local/share/devcontainer-plumbing/lib.sh

            # Only initialize.sh writes these, and only on the host, so they pin the fact
            # that devcontainers/ci runs initializeCommand (plain `devcontainer build`
            # doesn't).
            test -L .devcontainer/.host-git-common
            test -s .devcontainer/.git-plumbing/host-git-common-path

            # Both container hooks reached the shared plumbing. Every other postStart effect
            # is environment-dependent here (the agent socket is a placeholder regular
            # file, allowed_signers is empty), so the stamps are what's assertable.
            test -f /run/devcontainer-plumbing/post-create.stamp
            test -f /run/devcontainer-plumbing/post-start.stamp

            # `--file` skips repo discovery, which would trip git's dubious-ownership
            # check (runner uid != container uid).
            test "$(git config --file .git/config --get core.checkstat)" = "minimal"
            test "$(git config --file .git/config --get core.trustctime)" = "false"

            # Timezone came from the host snapshot, and applied idempotently: postCreate
            # and postStart both ran, so an appending /etc/environment write reads as 2.
            tz="$(cat .devcontainer/.git-plumbing/host-timezone)"
            test -n "$tz"
            test "$(cat /etc/timezone)" = "$tz"
            readlink /etc/localtime | grep -q "zoneinfo/${tz}$"
            test "$(grep -c '^TZ=' /etc/environment)" = "1"

            # CI is a full clone, so the bridge must no-op: the workspace mount already
            # provides .git, and an unguarded `ln -sfn` would nest a stray link inside it.
            test -d .git && test ! -L .git
            test ! -e .git/host-git-common

            # The two ssh trust binds resolved. A dangling symlink would have failed the
            # `up` already, but assert explicitly so it's clear CI is what exercises the
            # empty-allowed-signers fallback — the runner has no signers file of its own.
            test -e "$HOME/.ssh/known_hosts"
            test -e "$HOME/.ssh/allowed_signers"
            test ! -s "$HOME/.ssh/allowed_signers"

            # Pin the mount flags, which is what makes host write-back work at all.
            test -w "$HOME/.ssh/known_hosts"
            test ! -w "$HOME/.ssh/allowed_signers"

      - if: needs.changes.outputs.changed != 'true' && needs.changes.outputs.pin == 'published'
        run: echo "No devcontainer changes in this PR; skipping build."

  # Not required, deliberately: a failed publish turns PRs red here without blocking them, since
  # the blocking evidence for an unpublished pin is the base build the jobs above run instead.
  pin-published:
    name: Base image pin published
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check the pinned base image is published
        env:
          PIN: ${{ needs.changes.outputs.pin }}
        run: |
          set -euo pipefail
          case "$PIN" in
            published) echo "GHCR serves the base image this tree pins." ;;
            edited) echo "This change moves the pin; the publish job pushes its image on merge." ;;
            unpublished)
              msg="GHCR does not serve the base image this tree pins; the probe in 'Detect"
              msg="${msg} devcontainer changes' logs the digest and the registry's response. This"
              msg="${msg} run built and tested the base from the tree instead. If the publish for"
              msg="${msg} the merge that moved the pin is still running, re-run all jobs once"
              msg="${msg} it finishes. Otherwise republish: run the Devcontainer workflow on main."
              echo "::error title=Base image pin not published::${msg}"
              exit 1
              ;;
            *) echo "::error::unexpected pin state '${PIN}'"; exit 1 ;;
          esac

  # Publish LAST — `needs` both smoke jobs, so a base that failed on either architecture, or
  # that broke this repo's own devcontainer build, never reaches the registry.
  #
  # `oci_push` pushes the exact multi-arch index Bazel built, so unlike a `docker buildx`
  # publish this is the artifact that was smoke-tested rather than a rebuild of it. Runs on one
  # runner regardless of architecture: nothing is executed to produce either variant, so the
  # index is assembled from two sets of already-built layers.
  #
  # Known non-atomicity: the runner does `crane push repo@digest` and then one `crane tag` per
  # tag, so a failure between them can leave :latest moved with sha-<gitsha> missing. Re-running
  # fixes it — a half-tagged package is not a corrupt push.
  #
  # :latest is what Renovate digest-pins; :sha-<gitsha> is the immutable audit trail.
  publish:
    name: Publish the shared base image
    needs:
      - changes
      - base-image-all
      - build-and-smoke-test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.changes.outputs.base == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bazel-remote
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # oci_push's registry client reads the docker config this writes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          set -euo pipefail
          bazel run --config=ci //meta/devcontainer-base:push -- \
            --tag latest --tag "sha-${GITHUB_SHA}"

      # The one loose end neither the pre-commit hook nor renovate-derived-files.yml can see:
      # both run before the merge, and this is the step that can fail after it. `crane push`
      # then one `crane tag` per tag is not atomic, so a failure in between leaves main pinned
      # to a digest the registry does not serve — silent until someone rebuilds a devcontainer.
      #
      # Reads the pin with sync_base_image_pin.py rather than a grep of its own, so the digest
      # has one parser and this cannot degrade into a check that always passes.
      #
      # Retried because GHCR does not document tag resolution as read-your-writes and this runs
      # seconds after `crane tag`. A transient miss would turn main red for exactly the reason
      # the step exists to rule out, and tell the reader to re-run a job that was fine.
      - name: Verify the registry serves what main pins
        run: |
          set -euo pipefail
          repo=ghcr.io/syndic/unnatural_designs-devcontainer-base
          pinned="$(python3 meta/scripts/sync_base_image_pin.py --print-pinned)"
          err="${RUNNER_TEMP}/imagetools-inspect.err"
          attempts=3

          # `@digest` is what a consumer's FROM resolves; the tags are what Renovate and any
          # non-deriving consumer read, and they are the half `crane tag` can leave behind.
          # One tool for all three: `imagetools inspect` takes a digest reference too, and
          # `docker manifest` is still nominally an experimental CLI command.
          for ref in "@${pinned}" ":latest" ":sha-${GITHUB_SHA}"; do
            resolved=""
            rc=0
            for attempt in $(seq "$attempts"); do
              # stderr and the exit status are both kept: propagation lag, an auth failure and
              # an unreachable registry otherwise look alike, and a `timeout` kill writes no
              # stderr at all, so the status is the only thing that names that one.
              rc=0
              resolved="$(timeout 60 docker buildx imagetools inspect \
                --format '{{.Manifest.Digest}}' "${repo}${ref}" 2>"$err")" || rc=$?
              [ "$resolved" = "$pinned" ] && break
              # `||` rather than `&&`: a failing `&&` guard returns 1, which set -e traps.
              [ "$attempt" -eq "$attempts" ] || sleep $((attempt * 5))
            done
            if [ "$resolved" != "$pinned" ]; then
              echo "::error::${repo}${ref} resolved to '${resolved:-nothing}' after" \
                   "${attempts} attempts, but main pins ${pinned}." \
                   "Re-run this job — crane tags non-atomically."
              hint=""
              [ "$rc" -ne 124 ] || hint=" (timed out)"
              echo "Last attempt exited ${rc}${hint}; its stderr follows:"
              cat "$err"
              exit 1
            fi
          done
          echo "${repo}@${pinned} is published and both tags point at it."
