name: Devcontainer

# Build the devcontainer and smoke-test the toolchain it ships. Catches breakage from
# Renovate-driven bumps to the Debian base, the `features` block (go, etc.), the Dockerfile's
# PYTHON_VERSION, or BAZELISK_VERSION before someone hits it locally.
# The workflow always runs so the status check always reports — a trigger-level `paths:`
# filter would skip the workflow entirely on unrelated PRs, leaving a required check
# permanently pending. Path filtering happens inside the job instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same PR; see .claude/CLAUDE.md "Superseding CI runs".
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push/pull the devcontainer build-cache image on GHCR

jobs:
  build-and-smoke-test:
    name: Build devcontainer and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history back to the PR base / previous push so we can diff for changed paths.
          fetch-depth: 0

      # Pick the base to diff against (the classifier handles the diff, the zero-SHA
      # branch-creation case, and emitting `changed`). PRs diff the base branch tip;
      # pushes diff the previous tip.
      - id: changes
        name: Detect devcontainer changes
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 meta/scripts/classify_changed_paths.py \
            --base "$base" \
            --rule 'changed=^\.devcontainer/|^meta/devcontainer-base/|^\.github/workflows/devcontainer\.yml$' \
            --rule 'base=^meta/devcontainer-base/'

      # ── Feature lock freshness ────────────────────────────────────────────────────
      # devcontainer-lock.json is derived from the feature references in devcontainer.json and
      # regenerated by renovate-derived-files.yml. This is the guard that the committed copy
      # actually matches — the counterpart to the `bazel-mod-tidy` and `uv-lock-fresh` pre-commit
      # hooks the other derived files get. It lives in CI rather than pre-commit because the
      # devcontainer CLI is a host/runner tool: it is deliberately absent from the image, so a
      # `language: system` hook running inside the container could not invoke it.
      #
      # `upgrade --dry-run` prints the lockfile it *would* write to stdout instead of writing it,
      # byte-for-byte including the trailing newline, so a plain diff is the whole check. Runs
      # unconditionally (it is seconds, and a hand-edited lock is worth catching on any PR) and
      # before the build, so a drifted lock fails fast rather than after a five-minute build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24.18.1"

      - name: Check the feature lock is in sync
        env:
          # renovate: datasource=npm depName=@devcontainers/cli
          DEVCONTAINER_CLI_VERSION: "0.88.0"
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"
          devcontainer upgrade --workspace-folder . --dry-run > /tmp/expected-lock.json
          if ! diff -u .devcontainer/devcontainer-lock.json /tmp/expected-lock.json; then
            MSG="Feature lock is out of sync with the references in devcontainer.json."
            MSG="${MSG} Run 'devcontainer upgrade --workspace-folder .' and commit the result."
            echo "::error file=.devcontainer/devcontainer-lock.json::${MSG}"
            exit 1
          fi
          echo "Feature lock matches the references in devcontainer.json."

      # Cache the built image in GHCR so the expensive feature layers (Go tools ~90s, etc.)
      # are reused across runs instead of rebuilt cold every time. The ref must be lowercase
      # (GHCR rejects uppercase), and ${{ github.repository }} carries the org's casing.
      # Only the consumer build needs a ref computed here; the base image's own repository is
      # declared on the `oci_push` target in meta/devcontainer-base/BUILD.bazel.
      - id: img
        if: steps.changes.outputs.changed == 'true'
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-devcontainer" >> "$GITHUB_OUTPUT"

      # Auth for the GHCR cache and for `oci_push`, which reads the same docker config. Skipped
      # on fork PRs — their read-only token can't reach the package, so they fall back to a cold
      # build. Needs the packages: write permission above. `base` implies `changed` today; both
      # are named so the intent survives if that ever stops being true.
      - if: >-
          (steps.changes.outputs.changed == 'true' || steps.changes.outputs.base == 'true')
          && github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Shared base image ─────────────────────────────────────────────────────────
      # meta/devcontainer-base/ is published for other Syndic repos to FROM. It is assembled by
      # Bazel, so `bazel build //...` covers it and the layer layout is unit-tested without a
      # daemon (//meta/devcontainer-base:test_image_layers, which runs in the Build and test
      # job). What is left for this job is what Bazel deliberately does not do: put the image
      # in a daemon and actually run it. This repo does not FROM the image yet — that repoint,
      # and the BASE_IMAGE override that lets a base change be tested against a real consumer
      # in one PR, come next. See meta/devcontainer-base/README.md.
      - if: steps.changes.outputs.base == 'true'
        uses: ./.github/actions/setup-bazel-remote
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      # `oci_load` is the one part Bazel can't do hermetically: it hands the image to a Docker
      # daemon. The repository cache from the setup action keeps the base image layers from
      # being refetched on every run.
      - if: steps.changes.outputs.base == 'true'
        name: Load the shared base image into Docker
        run: bazel run --config=ci //meta/devcontainer-base:load

      - if: steps.changes.outputs.base == 'true'
        name: Smoke test the base image
        run: |
          set -euo pipefail
          docker run --rm devcontainer-base:ci bash -c '
            set -euo pipefail
            command -v devcontainer-plumbing >/dev/null
            test -x "$(command -v devcontainer-plumbing)"
            # The dispatcher is installed on PATH but its library is not beside it, so this
            # also proves the absolute fallback path resolves in the image layout.
            test -r /usr/local/share/devcontainer-plumbing/lib.sh

            # A bad verb must be a usage error, not a silent no-op or a partial apply.
            rc=0
            out="$(devcontainer-plumbing bogus-verb 2>&1)" || rc=$?
            test "$rc" -eq 2
            case "$out" in usage:*) ;; *) echo "unexpected: $out" >&2; exit 1 ;; esac

            # Same for no verb at all.
            rc=0
            devcontainer-plumbing >/dev/null 2>&1 || rc=$?
            test "$rc" -eq 2
            echo "base image smoke test OK"
          '

      # devcontainers/ci builds with the full feature set (so feature bumps are exercised,
      # not just the Dockerfile) and runs the smoke command inside the resulting container.
      # cacheFrom reuses the previously-built layers; push: filter seeds the cache on pushes
      # to main only (PRs build against the cache but don't publish).
      - if: steps.changes.outputs.changed == 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ${{ steps.img.outputs.ref }}
          cacheFrom: ${{ steps.img.outputs.ref }}
          push: filter
          # `bazel --version` exercises the full Bazelisk chain: download from the URL
          # baked into BAZELISK_VERSION, then bootstrap Bazel per .bazelversion.
          # `go version` confirms the `go` feature landed the toolchain on PATH;
          # `python3 --version` confirms the Dockerfile's uv-installed interpreter did.
          # The rest pins the host-plumbing mechanism — see ".devcontainer worktree +
          # timezone plumbing" in .claude/CLAUDE.md.
          runCmd: |
            set -euo pipefail
            bazel --version
            go version
            python3 --version

            # Only initialize.sh writes these, and only on the host, so they pin the fact
            # that devcontainers/ci runs initializeCommand (plain `devcontainer build`
            # doesn't).
            test -L .devcontainer/.host-git-common
            test -s .devcontainer/.git-plumbing/host-git-common-path

            # Both container hooks reached the shared plumbing. Every other postStart effect
            # is environment-dependent here (the agent socket is a placeholder regular
            # file, allowed_signers is empty), so the stamps are what's assertable.
            test -f /run/devcontainer-plumbing/post-create.stamp
            test -f /run/devcontainer-plumbing/post-start.stamp

            # `--file` skips repo discovery, which would trip git's dubious-ownership
            # check (runner uid != container uid).
            test "$(git config --file .git/config --get core.checkstat)" = "minimal"
            test "$(git config --file .git/config --get core.trustctime)" = "false"

            # Timezone came from the host snapshot, and applied idempotently: postCreate
            # and postStart both ran, so an appending /etc/environment write reads as 2.
            tz="$(cat .devcontainer/.git-plumbing/host-timezone)"
            test -n "$tz"
            test "$(cat /etc/timezone)" = "$tz"
            readlink /etc/localtime | grep -q "zoneinfo/${tz}$"
            test "$(grep -c '^TZ=' /etc/environment)" = "1"

            # CI is a full clone, so the bridge must no-op: the workspace mount already
            # provides .git, and an unguarded `ln -sfn` would nest a stray link inside it.
            test -d .git && test ! -L .git
            test ! -e .git/host-git-common

            # The two ssh trust binds resolved. A dangling symlink would have failed the
            # `up` already, but assert explicitly so it's clear CI is what exercises the
            # empty-allowed-signers fallback — the runner has no signers file of its own.
            test -e "$HOME/.ssh/known_hosts"
            test -e "$HOME/.ssh/allowed_signers"
            test ! -s "$HOME/.ssh/allowed_signers"

            # Pin the mount flags, which is what makes host write-back work at all.
            test -w "$HOME/.ssh/known_hosts"
            test ! -w "$HOME/.ssh/allowed_signers"

      # Publish the base image LAST, so a base that failed its own smoke test — or broke this
      # repo's devcontainer build above — never reaches the registry.
      #
      # `oci_push` pushes the exact multi-arch index Bazel built, so unlike a `docker buildx`
      # publish this is the same artifact the smoke test loaded rather than a rebuild of it.
      # No QEMU and no second builder are involved: nothing is executed to produce either
      # architecture, so the index is assembled from two sets of layers.
      #
      # :latest is what Renovate digest-pins; :sha-<gitsha> is the immutable audit trail.
      # Credentials come from the docker/login-action step above, which writes the config
      # oci_push's registry client reads.
      - if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.changes.outputs.base == 'true'
        name: Publish the shared base image
        run: |
          set -euo pipefail
          bazel run --config=ci //meta/devcontainer-base:push -- \
            --tag latest --tag "sha-${GITHUB_SHA}"

      - if: steps.changes.outputs.changed != 'true'
        run: echo "No devcontainer changes in this PR; skipping build."
