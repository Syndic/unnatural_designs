name: Setup Bazel with remote cache
description: Installs Bazel via Bazelisk and configures the Buildbuddy remote cache.

inputs:
  buildbuddy-api-key:
    description: Buildbuddy API key for remote cache authentication
    required: true
  cache-namespace:
    description: >-
      Which repo-footprint class this job's Bazel caches belong to. Jobs sharing a value must
      fetch the same external repos, and each value needs a producer that runs on main.
      See .claude/CLAUDE.md "Bazel cache namespacing".
    required: true

runs:
  using: composite
  steps:
    # `cache-version` is the base cache key's namespace, and the only lever that can separate the
    # repository cache: `repository-cache`'s string form names files to hash, not a namespace.
    # `disk-cache: true` because `cache-version` already separates it.
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true
        cache-version: ${{ inputs.cache-namespace }}
    - run: echo "common --remote_header=x-buildbuddy-api-key=${{ inputs.buildbuddy-api-key }}" >> .bazelrc.user
      shell: bash
