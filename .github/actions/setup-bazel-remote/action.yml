name: Setup Bazel with remote cache
description: Installs Bazel via Bazelisk and configures the Buildbuddy remote cache.

inputs:
  buildbuddy-api-key:
    description: Buildbuddy API key for remote cache authentication
    required: true

runs:
  using: composite
  steps:
    # `cache-version` is the whole base cache key's namespace, so it separates the repository
    # cache per workflow the way a string `disk-cache` does for the disk cache — and it is the
    # only lever that can: `repository-cache`'s string form names files to hash, not a
    # namespace. Sharing one entry across workflows means the narrowest job wins the write and
    # every other job restores its partial footprint; see .claude/CLAUDE.md "Bazel cache
    # namespacing". `disk-cache: true` because `cache-version` already separates it.
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true
        cache-version: ${{ github.workflow }}
    - run: echo "common --remote_header=x-buildbuddy-api-key=${{ inputs.buildbuddy-api-key }}" >> .bazelrc.user
      shell: bash
