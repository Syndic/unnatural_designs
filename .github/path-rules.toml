# Named path-classification rule sets, shared by every site that decides whether a changed path
# matters. Each set is defined once here; consumers name the sets they want rather than restating
# the patterns.
#
# Consumed by:
#   - meta/scripts/classify_changed_paths.py, for the `--emit` groups both workflows classify into
#   - meta/scripts/base_image_pin_hook.py, for the pre-commit hook's gate
#
# A set is `patterns` — regexes matched with `re.search` against each changed path — plus an
# optional `include` naming other sets whose patterns are folded in. Composition is the point.
# The base-image input set decides both whether a new image is published and whether the
# consumer's pin in .devcontainer/Dockerfile is re-derived, and those two have to agree: a path
# that re-derives the pin without triggering a publish writes a digest no job ever pushes — a red
# PR with no way to green it. One definition makes them agree by construction, where three copies
# agreed only by review.

[rules.bazel]
# The Bazel manifests. Two consumers, one set. For renovate-derived-files.yml this means "an input
# that invalidates MODULE.bazel.lock moved" — the module graph, or the bazel release, whose
# `lockFileVersion` and recorded extension shape the lock tracks. For the base image it means the
# manifests the image is *assembled from*: the `devcontainers_base_debian` oci.pull it sits on,
# plus the rules_oci / rules_pkg versions that lay it out.
#
# MODULE.bazel is deliberately matched whole-file rather than grepped for the pull's name. It
# moves on roughly 1 in 6 commits here and most of those cannot touch the image, so the false
# positives are real and not cheap: two base-image runners, plus a consumer build that cold-misses
# `cacheFrom` from the FROM layer down. Narrowing to one dep name would trade that for silence on
# a rules_oci or rules_pkg bump that *does* change the assembled bytes — the hole this exists to
# close.
#
# `.bazelversion` is the expensive direction, deliberately: the bazel version cannot enter
# `pkg_tar` layers over a pulled base, so every bazelisk bump buys a publish of a byte-identical
# index. The cheap alternative — leave it out of the re-derivation and let
# //.devcontainer:test_base_image_pin fail if the digest ever does move — leaves the recovery path
# needing a config change at the moment someone is already confused. A recurring known cost beats
# a rare unrecoverable one.
#
# Root-anchored: there is one Bazel module and one `.bazelversion`, both at the repo root, and
# bazelisk resolves upward to the root copy regardless. If a nested module ever appears, whether
# it restales the base-image pin deserves a deliberate answer rather than one inherited from a
# rule written for something else.
patterns = ['^MODULE\.bazel$', '^\.bazelversion$']

[rules.base]
# Everything the devcontainer base image is assembled from — the publish job's gate. Without the
# manifests above, Renovate's automerged digest bump would move the pin, skip every base job, and
# never republish, so the published image would keep the superseded Debian layers and the bump
# would reach nothing.
include = ["bazel"]
# A plain prefix rather than a per-file allowlist. The README under here is rationale rather than
# build input, but the image is cheap to rebuild and an allowlist would drift from the directory.
patterns = ['^meta/devcontainer-base/']

[rules.changed]
# Anything that can change what this repo's own devcontainer builds. A superset of `base` by
# construction, which is what the BASE_IMAGE override needs: the load step is gated on `base` and
# the consumer build on `changed`, so a path setting `base` alone would load an image nothing then
# builds against. Including `base` is also what gates an automerged bump on a real consumer build,
# which is what the publish job requires.
include = ["base"]
patterns = ['^\.devcontainer/', '^\.github/workflows/devcontainer\.yml$']

[rules.python]
# Python manifests Renovate can move. Whether a Python change ALSO needs a Bazel lock refresh is
# decided later, on whether requirements_lock.txt actually moved — a pyproject-only edit that
# re-resolves the same leaves MODULE.bazel.lock's pip `facts` valid. `(^|/)` rather than `^`: a
# workspace member's pyproject.toml lives at depth.
patterns = ['(^|/)pyproject\.toml$', '(^|/)uv\.lock$', '(^|/)requirements_lock\.txt$']

[rules.go]
# A Renovate Go bump always edits a go.mod (and go.sum alongside it), so go.mod covers every case;
# go.sum and go.work.sum are derived by tidy/sync and never the sole trigger. go.work carries the
# go directive and the workspace member list. `(^|/)` catches the per-module go.mod at any depth.
patterns = ['(^|/)go\.mod$', '(^|/)go\.work$']

[rules.devcontainer]
# Only devcontainer.json moves the feature references, and the lock is keyed by the reference
# string, so any edit here restales every entry. `^`-anchored: this repo has exactly one
# devcontainer, and a vendored copy under some subdirectory is not ours to re-resolve. The
# Dockerfile and lifecycle scripts feed the image build instead — `changed` covers those.
patterns = ['^\.devcontainer/devcontainer\.json$']
