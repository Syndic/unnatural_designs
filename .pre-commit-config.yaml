repos:
  - repo: local
    hooks:
      - id: bazel-mod-tidy
        name: bazel mod tidy
        language: system
        entry: bazel mod tidy
        pass_filenames: false
        files: go\.(mod|work|sum)$

      - id: uv-lock-fresh
        name: uv lock + export
        language: system
        # Re-runs the lock and the requirements_lock.txt export so a pyproject
        # edit can't land without the derived files. uv.lock is the source of
        # truth; requirements_lock.txt is what rules_python's pip.parse reads.
        # Hashes are deliberately kept — rules_python's pip.parse uses them to
        # verify the exact wheel uv resolved against; without them, pip.parse
        # round-trips to PyPI's Simple API and accepts any wheel for the pinned
        # version (see MODULE.bazel near `pip.parse` for the full rationale).
        entry: bash -c 'set -euo pipefail; uv lock; uv export --format requirements-txt --no-emit-project --output-file requirements_lock.txt'
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|requirements_lock\.txt)$

      - id: base-image-pin
        name: sync devcontainer base-image pin
        language: system
        # The Dockerfile's FROM digest is derived from the image this repo builds, so an edit
        # to the base or to the MODULE.bazel pull it sits on restales it in the same commit.
        # Rewrites rather than reports, like the two hooks above; //.devcontainer:test_base_image_pin
        # is the CI-side check for commits that never ran a hook.
        #
        # `bazel build` runs under the default --lockfile_mode=update, so on a MODULE.bazel-only
        # commit — which bazel-mod-tidy above does not cover, its files are go.mod/work/sum —
        # this can rewrite MODULE.bazel.lock too. pre-commit then blames base-image-pin for
        # modifying files. The lock really was stale; the attribution is what misleads.
        #
        # No `files:` filter, deliberately: which paths are inputs to the image is defined in
        # .github/path-rules.toml, which a pre-commit regex cannot read. The hook takes the
        # staged filenames and gates on the shared set itself, doing nothing on a commit that
        # touches none of them.
        entry: python3 meta/scripts/base_image_pin_hook.py
        # Without this pre-commit partitions the filename list — at more than four staged files,
        # not just at the arg-length limit — and runs the partitions in a thread pool. Two
        # partitions each holding a base input would then reach the pin rewrite at once, and its
        # read-then-truncating-write can hand the other a half-written Dockerfile. Serial keeps
        # any split sequential, which the hook is already safe under.
        require_serial: true

      # ruff check first (with --fix), then ruff format — check's import
      # sorting can produce output the formatter wants to retouch. Both fix in
      # place; pre-commit re-flags modified files so the user re-stages.
      - id: ruff-check
        name: ruff check --fix
        language: system
        entry: ruff check --fix
        pass_filenames: false
        files: \.py$

      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff format
        pass_filenames: false
        files: \.py$

      - id: gazelle
        name: gazelle
        language: system
        entry: bazel run //:gazelle
        pass_filenames: false
        files: \.go$

      - id: check-secrets-dir
        name: check secrets directory
        language: python
        entry: python meta/scripts/check_secrets_dir.py
        pass_filenames: true
        files: ^secrets/
